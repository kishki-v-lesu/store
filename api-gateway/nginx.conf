worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream auth_service {
        server auth-service:8000;
    }
    upstream product_service {
        server product-service:8000;
    }
    upstream order_service {
        server order-service:8000;
    }
    upstream payment_service {
        server payment-service:8000;
    }

    server {
        listen 80;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /docs { proxy_pass http://auth_service/docs; }
        location = /openapi.json { proxy_pass http://auth_service/openapi.json; }

        # === DOCUMENTATION (Docs & Swagger JSON) ===
        # Пересылаем документацию в корень сервиса, так как root_path=/auth
        location = /auth/docs { proxy_pass http://auth_service/docs; }
        location = /auth/openapi.json { proxy_pass http://auth_service/openapi.json; }

        location = /products/docs { proxy_pass http://product_service/docs; }
        location = /products/openapi.json { proxy_pass http://product_service/openapi.json; }

        location = /orders/docs { proxy_pass http://order_service/docs; }
        location = /orders/openapi.json { proxy_pass http://order_service/openapi.json; }

        location = /payments/docs { proxy_pass http://payment_service/docs; }
        location = /payments/openapi.json { proxy_pass http://payment_service/openapi.json; }

        # === API REQUESTS ===
        location /api/v1/auth/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://auth_service/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/products/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://product_service/api/v1/products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/orders/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://order_service/api/v1/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/payments/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://payment_service/api/v1/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }
    }
}
