name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy info
        run: |
          echo "Deploy configuration not set up"
          echo "Configure secrets to enable deployment"
          echo "Required: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY"